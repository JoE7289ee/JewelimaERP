<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0D2B1E">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jewelima">
<link rel="apple-touch-icon" href="/assets/jewelima/images/brand/favicon-180.png">
<link rel="manifest" href="/jw-manifest.json">
<title>Jewelima</title>
{% for href in jw_css %}<link rel="stylesheet" href="{{ href }}">{% endfor %}
<script>
	// the frappe object the CSRF line below writes into; the React app reads it for writes
	window.frappe = window.frappe || {};
	window.JW = {
		user: {{ jw_user | tojson }},
		fullName: {{ jw_full_name | tojson }},
		build: {{ jw_build | tojson }},
		mock: new URLSearchParams(location.search).has("mock"),
	};
</script>
<!-- csrf_token -->
</head>
<body>
<div id="root"></div>
{% if jw_js %}<script type="module" src="{{ jw_js }}"></script>
{% else %}<p style="font-family:sans-serif;color:#FAF7EF;padding:24px">The app has not been built yet.</p>{% endif %}
</body>
</html>
